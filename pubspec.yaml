name: impairgency
description: Assistive navigation, environment awareness and emergency contact for visually impaired users, with a guardian app and a web admin dashboard.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Routing. One codebase, three platforms - the web/mobile split lives in
  # lib/app/router.dart.
  go_router: ^14.0.0
  provider: ^6.1.5

  # Firebase
  firebase_core: ^3.14.0
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.9
  firebase_messaging: ^15.1.0      # §3.2 guardian SOS alerts
  # firebase_performance is deliberately NOT declared. Its Gradle plugin still
  # uses com.android.build.api.transform.Transform, which AGP 8 removed, so it
  # fails the Android build outright. Nothing is lost: the dashboard links to
  # the Firebase console for performance data rather than mirroring it, because
  # reading it back needs a service account and therefore a paid plan. See
  # docs/EMERGENCY_DELIVERY.md and the System health screen.
  firebase_crashlytics: ^4.1.0     # §1.4 crashes

  # §3.2 guardian alerts. Raised locally by the guardian app from a Firestore
  # listener, because server-side fan-out needs Cloud Functions and Cloud
  # Functions need a billing account. See docs/EMERGENCY_DELIVERY.md.
  flutter_local_notifications: ^19.0.0

  # Location. §2.A.4 sharing, §2.A.5 SOS, §3.1 guardian tracking, and the
  # location_history collection Phase 2 aggregates for the learning features.
  geolocator: ^13.0.0

  # Voice
  speech_to_text: ^7.4.0
  flutter_tts: ^4.0.2

  # Vision - §2.A.1 object detection, §2.A.3 environment.
  #
  # tflite_flutter, not ML Kit. cprwire declared google_mlkit_object_detection
  # and never used it: the scan screen ran an SSD MobileNet through TFLite. ML
  # Kit's MLImage.framework ships no arm64 simulator slice and breaks every iOS
  # simulator build, so leaving it out is both correct and free.
  #
  # The model is now YOLO11n rather than that SSD, exported to LiteRT at 640.
  # It is a better detector on the things this app is for - people, chairs,
  # doors, cars - and it is also the thing that makes the scan screen's output
  # worth trusting rather than merely present. Note the licence: Ultralytics
  # ship YOLO11 under AGPL-3.0, so distributing this APK means either
  # publishing the source under the same terms or holding an Ultralytics
  # enterprise licence. See docs/VISION.md.
  #
  # The same interpreter runs the two face models for recognising friends,
  # both in assets/models/ with their hashes and licence terms in
  # docs/VISION.md, "Faces". A build without them still runs, and says
  # recognition is not available.
  camera: ^0.12.0
  tflite_flutter: ^0.11.0
  image: ^4.2.0

  # Reading text - books, labels, documents - is a different job from
  # spotting a chair, and the detector above cannot do it. This is the one
  # maintained on-device OCR for Flutter; the alternative, Tesseract, needs
  # trained-data files shipped with the app and a pixel pipeline of its own.
  # It is the text-recognition half of ML Kit only, not the object detector
  # the comment above declined: google_mlkit_commons 0.13 ships an arm64
  # simulator slice, so the simulator objection no longer applies. Confirm
  # with `flutter build ios --simulator` before relying on it.
  google_mlkit_text_recognition: ^0.17.1

  permission_handler: ^11.3.0
  # flutter_contacts is deliberately NOT declared. Its iOS plugin registration
  # is:
  #
  #   UIApplication.shared.delegate!.window!!.rootViewController!
  #
  # Three force-unwraps, and since iOS 13 windows belong to scenes rather than
  # the app delegate, so `delegate.window` is nil. It crashes on launch in any
  # app that merely includes the plugin, whether or not the app ever calls it.
  #
  # When the emergency contact picker is built, prefer the *system* picker -
  # CNContactPickerViewController on iOS, ACTION_PICK on Android. It needs no
  # contacts permission at all, because the user chooses the one contact
  # themselves rather than granting the app their whole address book. For an app
  # handling data about disabled people, that is the better design anyway.
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.3
  intl: ^0.20.3
  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  # Walking routes (routing.openstreetmap.de) and place search
  # (photon.komoot.io). Already in the lock file through Firebase; named here
  # because the app now calls it itself.
  http: ^1.6.0
  # Where saved friends' faces are kept: the app's own support folder, on the
  # phone, excluded from backup. Already in the lock file through Firebase.
  path_provider: ^2.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Each model named, not the folder: the 66 MB MiDaS depth model sits in
  # assets/models/ for the depth device check (git-ignored), and a folder
  # entry put it in every tester APK. tool/build_depth_check.sh adds it for
  # that one build.
  assets:
    - assets/models/yolo11n.tflite
    - assets/models/labels.txt
    - assets/models/face_detection_short_range.tflite
    - assets/models/mobilefacenet.tflite
