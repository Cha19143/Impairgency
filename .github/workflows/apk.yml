# Builds the Android APK and attaches it to the run.
#
# It exists because the APK cannot be built everywhere the rest of this can.
# `flutter analyze`, `flutter test` and `flutter build web` need pub.dev and
# nothing else; an APK needs the Android SDK from dl.google.com and every
# AndroidX, Firebase and AGP artifact from Google's Maven, and a network that
# does not reach those two hosts can take this project all the way to a green
# suite and still not produce an installable file. A GitHub runner reaches
# them and already has the SDK on it.
#
# Download the arm64 APK from the run's Artifacts section, for three days.
# The testers' builds are on the GitHub release. It is signed with the
# debug keys - see the signingConfig in android/app/build.gradle.kts - so it
# installs for testing and is not fit for a store.
name: APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP 9 and Gradle 9.3 want 17 or newer; tool/test_rules.sh wants 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Pinned to the revision in .metadata. An APK built by a different
      # toolchain than the one the tests ran under is not the thing that was
      # tested.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - run: flutter pub get

      # Before the build, not after: an APK that ships a failing suite is
      # worse than no APK, because somebody will install it.
      - run: flutter analyze
      - run: flutter test

      # Two builds, because they answer different questions. The universal APK
      # installs on anything and is the one to hand someone whose phone you
      # cannot ask about; the per-ABI ones are a third of the size, and
      # arm64-v8a is what a handset made this decade actually runs. Sideloading
      # 82 MB over mobile data is a real cost to a real user.
      - run: flutter build apk --release
      - run: flutter build apk --release --split-per-abi

      # One file, kept three days. Every APK of every run used to be kept for
      # 90 days - about 145 MB a run - and five runs filled the account's
      # 500 MB of Actions storage: from September 16 every run failed here,
      # after everything it exists to check had passed.
      - uses: actions/upload-artifact@v4
        with:
          name: impairgency-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 3
